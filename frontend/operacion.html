<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operación — YaQueVas</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="YaQueVas">
<meta property="og:title" content="Ya que vas, gana — YaQueVas">
<meta property="og:description" content="Ha ganado dinero con un viaje que ya iba a hacer. Descubre cuánto puedes ganar tú.">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="yqv-nav"></div>

<section class="section">
  <div class="container" style="max-width:720px;">
    <a href="/mi-cuenta.html" class="btn-ghost">&larr; Volver a mi cuenta</a>
    <h1 id="title">Operación</h1>
    <div id="content">
      <div class="skeleton-card"><div class="skeleton skeleton-line w-40"></div><div class="skeleton skeleton-line w-80"></div><div class="skeleton skeleton-line w-60"></div></div>
    </div>
  </div>
</section>

<div id="yqv-footer"></div>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/nav.js"></script>
<script>
if (!YQV.requireLoginOrRedirect()) { /* redirige */ }
const bookingId = new URLSearchParams(window.location.search).get('id');
const user = YQV.getUser();

// Vuelta desde Stripe Checkout (pago real, no demo): el estado real llega por webhook, así que
// aquí solo avisamos — load() más abajo ya pinta el estado actual de la operación.
const pagoParam = new URLSearchParams(window.location.search).get('pago');
if (pagoParam === 'ok') YQV.toast('Pago completado. Puede tardar unos segundos en reflejarse aquí.', 'ok');
if (pagoParam === 'cancelado') YQV.toast('Pago cancelado.', 'info');

function statusPill(status) {
  const good = ['pago_liberado', 'finalizado', 'entregado'];
  const bad = ['cancelado', 'rechazado', 'disputa', 'incidencia', 'bloqueado'];
  const cls = good.includes(status) ? 'ok' : bad.includes(status) ? 'danger' : 'warn';
  return `<span class="pill ${cls}">${YQV.STATUS_LABELS[status] || status}</span>`;
}

async function load() {
  const box = document.getElementById('content');
  let booking;
  try {
    const data = await YQV.api(`/api/bookings/${bookingId}`);
    booking = data.booking;
  } catch (err) {
    box.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    return;
  }

  const isSender = booking.sender_id === user.id;
  const isTraveler = booking.traveler_id === user.id;
  document.getElementById('title').innerHTML = `Operación ${statusPill(booking.status)}`;

  let html = `<div id="trustCard" style="margin-bottom:16px;"></div>`;
  html += `
    <div class="card">
      <div class="row between">
        <span>Rol: <strong>${isSender ? 'Remitente' : 'Viajero'}</strong></span>
        <span class="muted">${YQV.fmtDateTime(booking.created_at)}</span>
      </div>
      <div class="divider"></div>
      <table>
        <tr><td>Precio base</td><td>${YQV.fmtEur(booking.base_price)}</td></tr>
        <tr><td>Comisión remitente (+${booking.sender_commission_pct}%)</td><td>${YQV.fmtEur(booking.sender_total - booking.base_price)}</td></tr>
        <tr><td>Comisión viajero (-${booking.traveler_commission_pct}%)</td><td>${YQV.fmtEur(booking.base_price - booking.traveler_net)}</td></tr>
        <tr><td><strong>${isSender ? 'Total a pagar' : 'Total a cobrar'}</strong></td><td><strong>${YQV.fmtEur(isSender ? booking.sender_total : booking.traveler_net)}</strong></td></tr>
        <tr><td>Comisión total YaQueVas (12%)</td><td>${YQV.fmtEur(booking.platform_commission)}</td></tr>
      </table>
    </div>
  `;

  // --- Acciones del viajero: aceptar contenido ---
  if (isTraveler && booking.status === 'solicitado') {
    html += `
      <div class="card" style="margin-top:16px;">
        <h3>Revisa el envío antes de aceptar</h3>
        <p class="muted">Consulta el detalle completo del envío en <a href="#" id="viewShipmentLink">esta ficha</a> antes de continuar: contenido, peso, dimensiones, fotos, valor declarado y observaciones.</p>
        <div id="shipmentPreview"></div>
        <div class="checkbox-row">
          <input type="checkbox" id="confirmContent">
          <label for="confirmContent">He visto el contenido, peso, dimensiones, fotografías, valor declarado, fragilidad y observaciones de este envío.</label>
        </div>
        <div class="row" style="margin-top:12px;">
          <button class="btn btn-primary" id="acceptBtn">ACEPTO TRANSPORTAR ESTE ENVÍO</button>
          <button class="btn btn-outline" id="rejectBtn" style="color:var(--danger); border-color:var(--danger);">No puedo llevarlo</button>
        </div>
      </div>
    `;
  }

  // --- Acciones del remitente: pagar ---
  if (isSender && booking.status === 'aceptado') {
    html += `
      <div class="card" style="margin-top:16px;">
        <h3>El viajero ha aceptado tu envío</h3>
        <p>Realiza el pago para confirmar la operación. El importe queda retenido por el proveedor de pagos hasta que se confirme la entrega.</p>
        <button class="btn btn-primary btn-lg" id="payBtn">Pagar ${YQV.fmtEur(booking.sender_total)} (demo)</button>
      </div>
    `;
  }

  // --- QR / código, visible para ambos una vez aceptado ---
  if (['aceptado', 'pago_realizado', 'recogido', 'en_transito'].includes(booking.status)) {
    html += `<div id="qrSection" style="margin-top:16px;"></div>`;
  }

  // --- Chat: visible para ambos desde que hay operación aceptada (punto 28) ---
  if (!['solicitado', 'rechazado', 'cancelado'].includes(booking.status)) {
    html += `
      <div class="card" style="margin-top:16px;">
        <h3>Chat con ${isSender ? 'el viajero' : 'el remitente'}</h3>
        <div class="row" style="gap:8px; flex-wrap:wrap; margin-bottom:10px;">
          <button type="button" class="btn btn-outline chat-quick" data-action="ubicacion" style="padding:8px 12px; font-size:0.85rem;">${YQVIcons.svg('pin', { size: 15 })} Compartir ubicación</button>
          <button type="button" class="btn btn-outline chat-quick" data-action="hora" style="padding:8px 12px; font-size:0.85rem;">${YQVIcons.svg('clock', { size: 15 })} Proponer hora</button>
          <button type="button" class="btn btn-outline chat-quick" data-action="ver_viaje" style="padding:8px 12px; font-size:0.85rem;">${YQVIcons.svg('suitcase', { size: 15 })} Ver viaje</button>
          <button type="button" class="btn btn-outline chat-quick" data-action="ver_envio" style="padding:8px 12px; font-size:0.85rem;">${YQVIcons.svg('package', { size: 15 })} Ver envío</button>
        </div>
        <div id="chatMessages" style="max-height:280px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:4px;"></div>
        <div class="row" style="margin-top:10px; gap:8px;">
          <input id="chatInput" placeholder="Escribe un mensaje…" style="flex:1;">
          <button class="btn btn-primary" id="chatSendBtn">Enviar</button>
        </div>
      </div>
    `;
  }

  // --- Acciones del viajero: recogida / tránsito / entrega ---
  if (isTraveler && booking.status === 'pago_realizado') {
    html += `<div class="card" style="margin-top:16px;"><button class="btn btn-secondary" id="pickupBtn">Marcar como recogido</button></div>`;
  }
  if (isTraveler && booking.status === 'recogido') {
    html += `<div class="card" style="margin-top:16px;"><button class="btn btn-secondary" id="transitBtn">Marcar viaje iniciado</button></div>`;
  }
  if (isTraveler && ['recogido', 'en_transito'].includes(booking.status)) {
    html += `
      <div class="card" style="margin-top:16px;">
        <h3>Confirmar entrega</h3>
        <p>Escanea el QR del destinatario o introduce el código numérico de respaldo de 6 dígitos. Necesitas además una foto del envío entregado, como prueba.</p>
        <label class="first">Código numérico de respaldo</label>
        <input id="deliverCode" maxlength="6" placeholder="000000">
        <label>Foto de entrega (obligatoria)</label>
        <label class="btn btn-outline" for="deliverPhoto" style="cursor:pointer; display:inline-flex;">${YQVIcons.svg('camera', { size: 16 })} Hacer/adjuntar foto</label>
        <input id="deliverPhoto" type="file" accept="image/png,image/jpeg,image/webp" capture="environment" style="display:none;">
        <div id="deliverPhotoPreview" class="muted" style="font-size:0.8rem; margin-top:6px;"></div>
        <button class="btn btn-primary" id="deliverBtn" style="margin-top:12px;">Confirmar entrega</button>
      </div>
    `;
  }

  // --- Confirmación final de entrega ---
  if (['entregado', 'pago_liberado', 'finalizado'].includes(booking.status)) {
    html += `
      <div class="alert alert-ok" style="margin-top:16px;">
        <strong>Entrega confirmada.</strong> ${isSender
          ? 'El pago ha quedado liberado al viajero.'
          : `El pago de ${YQV.fmtEur(booking.traveler_net)} ha quedado liberado a tu cuenta.`}
        ${booking.delivered_at ? `<br><span class="muted">Entregado el ${YQV.fmtDateTime(booking.delivered_at)}.</span>` : ''}
      </div>
      ${booking.delivery_photo_url ? `
        <div class="card" style="margin-top:16px;">
          <h3 style="font-size:0.95rem;">Foto de entrega</h3>
          <img src="${booking.delivery_photo_url}" alt="Foto de la entrega confirmada" style="max-width:100%; border-radius:var(--radius-md); display:block;">
        </div>
      ` : ''}
    `;
    if (!isSender) {
      html += `
        <div class="card" style="margin-top:16px; text-align:center; background:var(--marine-900); color:white;">
          <p style="color:#D7E7FA; margin-bottom:4px;">Con un viaje que ya ibas a hacer</p>
          <div class="big-number" style="color:white;">+${YQV.fmtEur(booking.traveler_net)}</div>
          <button type="button" class="btn btn-primary" id="shareEarningsBtn" style="margin-top:12px;">${YQVIcons.svg('link', { size: 16 })} Compartir</button>
        </div>
      `;
    }
    html += `<div id="reviewSection" style="margin-top:16px;"></div>`;
  }
  if (['cancelado', 'rechazado'].includes(booking.status)) {
    html += `<div class="alert alert-error" style="margin-top:16px;">Esta operación se ha ${booking.status === 'cancelado' ? 'cancelado' : 'rechazado'} y no continuará.</div>`;
  }

  // --- Incidencias y cancelación ---
  if (!['entregado', 'pago_liberado', 'finalizado', 'cancelado', 'rechazado'].includes(booking.status)) {
    html += `
      <div class="card" style="margin-top:16px;">
        <div class="row between">
          <span class="muted">¿Algún problema con esta operación?</span>
          <div class="row">
            <button class="btn btn-outline" id="disputeBtn">Tengo un problema</button>
            <button class="btn btn-outline" id="cancelBtn" style="color:var(--danger); border-color:var(--danger);">Cancelar</button>
          </div>
        </div>
      </div>
    `;
  }

  box.innerHTML = html;

  // --- Eventos ---
  const shipmentBtn = document.getElementById('viewShipmentLink');
  if (shipmentBtn) shipmentBtn.addEventListener('click', async (e) => {
    e.preventDefault();
    try {
      const s = await YQV.api(`/api/shipments/${booking.shipment_id}`, { auth: false });
      const sh = s.shipment;
      const photos = sh.items.filter(i => i.photo_url);
      document.getElementById('shipmentPreview').innerHTML = `
        <div class="alert alert-info">
          <strong>Destinatario:</strong> ${sh.recipient_name}<br>
          <strong>Peso:</strong> ${sh.weight_kg} kg · <strong>Dimensiones:</strong> ${sh.dimensions || 'no indicadas'}<br>
          <strong>Valor declarado:</strong> ${sh.declared_value != null ? YQV.fmtEur(sh.declared_value) : 'no indicado'} · <strong>Frágil:</strong> ${sh.fragile ? 'Sí' : 'No'}<br>
          <strong>Bultos:</strong> ${sh.items.map(i => `${i.item_type} (${i.description || 'sin descripción'})`).join(', ')}<br>
          <strong>Observaciones:</strong> ${sh.notes || 'ninguna'}
          ${photos.length > 0 ? `
            <div style="margin-top:10px;">
              <strong>Fotos:</strong>
              <div class="row" style="gap:8px; margin-top:6px; flex-wrap:wrap;">
                ${photos.map(i => `<img src="${i.photo_url}" alt="Foto de ${i.item_type}" style="width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--line);">`).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    } catch (err) { YQV.toast(err.message, 'error'); }
  });

  const acceptBtn = document.getElementById('acceptBtn');
  if (acceptBtn) acceptBtn.addEventListener('click', async () => {
    if (!document.getElementById('confirmContent').checked) {
      YQV.toast('Debes confirmar que has visto el contenido antes de aceptar.', 'error'); return;
    }
    try {
      await YQV.api(`/api/bookings/${bookingId}/accept`, { method: 'POST', body: { confirmo_que_he_visto_el_contenido: true } });
      YQV.toast('Envío aceptado. Queda registrado con fecha y hora.', 'ok');
      load();
    } catch (err) { YQV.toast(err.message, 'error'); }
  });

  const rejectBtn = document.getElementById('rejectBtn');
  if (rejectBtn) rejectBtn.addEventListener('click', async () => {
    try { await YQV.api(`/api/bookings/${bookingId}/reject`, { method: 'POST' }); YQV.toast('Solicitud rechazada.', 'ok'); load(); }
    catch (err) { YQV.toast(err.message, 'error'); }
  });

  const payBtn = document.getElementById('payBtn');
  if (payBtn) payBtn.addEventListener('click', async () => {
    try {
      const res = await YQV.api(`/api/bookings/${bookingId}/pay`, { method: 'POST' });
      if (res.checkout_url) {
        // Pago real (Stripe configurado): el pago se confirma fuera de esta pestaña, vía
        // webhook, cuando Stripe avisa de que se completó — no en esta respuesta.
        window.location.href = res.checkout_url;
        return;
      }
      YQV.toast(res.aviso, 'ok');
      load();
    } catch (err) { YQV.toast(err.message, 'error'); }
  });

  const pickupBtn = document.getElementById('pickupBtn');
  if (pickupBtn) pickupBtn.addEventListener('click', async () => {
    try { await YQV.api(`/api/bookings/${bookingId}/pickup`, { method: 'POST' }); YQV.toast('Recogida confirmada.', 'ok'); load(); }
    catch (err) { YQV.toast(err.message, 'error'); }
  });

  const transitBtn = document.getElementById('transitBtn');
  if (transitBtn) transitBtn.addEventListener('click', async () => {
    try { await YQV.api(`/api/bookings/${bookingId}/in-transit`, { method: 'POST' }); YQV.toast('Viaje iniciado.', 'ok'); load(); }
    catch (err) { YQV.toast(err.message, 'error'); }
  });

  const deliverPhotoInput = document.getElementById('deliverPhoto');
  if (deliverPhotoInput) deliverPhotoInput.addEventListener('change', () => {
    const file = deliverPhotoInput.files[0];
    const preview = document.getElementById('deliverPhotoPreview');
    if (!file) { preview.textContent = ''; return; }
    if (file.size > 1.2 * 1024 * 1024) {
      preview.textContent = 'La foto es demasiado grande (máximo ~1MB).';
      deliverPhotoInput.value = '';
      return;
    }
    preview.textContent = `Foto lista: ${file.name}`;
  });

  function readFileAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  const deliverBtn = document.getElementById('deliverBtn');
  if (deliverBtn) deliverBtn.addEventListener('click', async () => {
    const code = document.getElementById('deliverCode').value.trim();
    const photoFile = deliverPhotoInput.files[0];
    if (!photoFile) { YQV.toast('Adjunta una foto del envío entregado para confirmar.', 'error'); return; }
    try {
      const delivery_photo = await readFileAsDataUrl(photoFile);
      await YQV.api(`/api/bookings/${bookingId}/deliver`, { method: 'POST', body: { backup_code: code, delivery_photo } });
      YQV.toast('Entrega confirmada. Pago liberado.', 'ok');
      load();
    } catch (err) { YQV.toast(err.message, 'error'); }
  });

  const disputeBtn = document.getElementById('disputeBtn');
  if (disputeBtn) disputeBtn.addEventListener('click', async () => {
    const type = prompt('Tipo de problema: no_recibido, danado, perdido, contenido, pago, entrega');
    if (!type) return;
    const description = prompt('Describe brevemente el problema:') || '';
    try {
      await YQV.api(`/api/bookings/${bookingId}/dispute`, { method: 'POST', body: { dispute_type: type, description } });
      YQV.toast('Incidencia registrada. La revisará el equipo de YaQueVas.', 'ok');
      load();
    } catch (err) { YQV.toast(err.message, 'error'); }
  });

  const cancelBtn = document.getElementById('cancelBtn');
  if (cancelBtn) cancelBtn.addEventListener('click', async () => {
    if (!confirm('¿Seguro que quieres cancelar esta operación?')) return;
    try {
      await YQV.api(`/api/bookings/${bookingId}/cancel`, { method: 'POST', body: { motivo: 'Cancelado por el usuario' } });
      YQV.toast('Operación cancelada.', 'ok');
      load();
    } catch (err) { YQV.toast(err.message, 'error'); }
  });

  const shareEarningsBtn = document.getElementById('shareEarningsBtn');
  if (shareEarningsBtn) shareEarningsBtn.addEventListener('click', () => {
    YQV.share({
      title: 'YaQueVas',
      text: `Ya que iba a viajar, he ganado ${YQV.fmtEur(booking.traveler_net)} con YaQueVas`,
      url: `${window.location.origin}/index.html`,
    });
  });

  const qrSection = document.getElementById('qrSection');
  if (qrSection) {
    try {
      const qr = await YQV.api(`/api/bookings/${bookingId}/qr`);
      const waLink = `https://wa.me/?text=${encodeURIComponent(`Aquí tienes el código para confirmar la entrega de tu envío en YaQueVas. Código de respaldo: ${qr.backup_code}`)}`;
      qrSection.innerHTML = `
        <div class="qr-box">
          <img src="${qr.qr_image}" alt="Código QR de la operación" class="qr-visual">
          <p class="muted" style="font-size:0.8rem; text-align:center;">Escanéalo con la cámara del móvil para confirmar la entrega.</p>
          <div class="backup-code">${qr.backup_code}</div>
          <a href="${waLink}" target="_blank" class="btn btn-secondary">Enviar por WhatsApp</a>
        </div>
      `;
    } catch (err) { /* puede que aún no haya QR */ }
  }

  // --- Chat ---
  const chatBox = document.getElementById('chatMessages');
  if (chatBox) {
    const actionLabels = {
      ubicacion: 'He compartido mi ubicación (indícala por WhatsApp o en persona).',
      hora: 'Propongo quedar para la entrega, dime qué hora te viene bien.',
      ver_viaje: 'Aquí tienes los detalles del viaje.',
      ver_envio: 'Aquí tienes los detalles del envío.',
    };

    async function loadMessages() {
      try {
        const data = await YQV.api(`/api/bookings/${bookingId}/messages`);
        chatBox.innerHTML = data.messages.length === 0
          ? '<p class="muted" style="font-size:0.85rem;">Todavía no hay mensajes. Escribe el primero.</p>'
          : data.messages.map(m => {
              const mine = m.sender_id === user.id;
              return `
                <div style="align-self:${mine ? 'flex-end' : 'flex-start'}; max-width:80%;">
                  <div style="background:${mine ? 'var(--marine-900)' : 'var(--mist-100)'}; color:${mine ? 'white' : 'var(--marine-900)'}; padding:8px 12px; border-radius:14px; font-size:0.9rem;">${YQV.escapeHtml(m.body)}</div>
                  <div class="muted" style="font-size:0.7rem; margin-top:2px; text-align:${mine ? 'right' : 'left'};">${YQV.fmtDateTime(m.created_at)}</div>
                </div>
              `;
            }).join('');
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (err) { /* silencioso, se reintenta en el próximo poll */ }
    }

    async function sendMessage(text, actionType) {
      try {
        await YQV.api(`/api/bookings/${bookingId}/messages`, { method: 'POST', body: { body: text, action_type: actionType || null } });
        await loadMessages();
      } catch (err) { YQV.toast(err.message, 'error'); }
    }

    document.getElementById('chatSendBtn').addEventListener('click', () => {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      sendMessage(text, null);
    });
    document.getElementById('chatInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('chatSendBtn').click();
    });
    document.querySelectorAll('.chat-quick').forEach((btn) => {
      btn.addEventListener('click', () => sendMessage(actionLabels[btn.dataset.action], btn.dataset.action));
    });

    loadMessages();
    if (window.__yqvChatPoll) clearInterval(window.__yqvChatPoll);
    window.__yqvChatPoll = setInterval(loadMessages, 5000);
  }

  // --- Tarjeta de confianza de la otra parte ---
  const trustCard = document.getElementById('trustCard');
  if (trustCard) {
    try {
      const otherId = isSender ? booking.traveler_id : booking.sender_id;
      const trust = await YQV.api(`/api/users/${otherId}/trust`, { auth: false });
      trustCard.innerHTML = `
        <div class="card row between" style="align-items:center;">
          <div class="row" style="gap:10px; align-items:center;">
            <div style="width:38px; height:38px; border-radius:50%; background:var(--marine-900); color:white; display:flex; align-items:center; justify-content:center; font-weight:700; flex:none;">${YQV.escapeHtml(trust.name.charAt(0).toUpperCase())}</div>
            <div>
              <strong>${YQV.escapeHtml(trust.name)}</strong>
              ${trust.identity_verified ? `<span class="pill ok" style="margin-left:6px;">Identidad verificada</span>` : ''}
              <div class="muted" style="font-size:0.82rem;">
                ${trust.rating_count > 0 ? `★ ${trust.rating_avg} (${trust.rating_count})` : 'Sin valoraciones todavía'} · ${trust.completed_operations} operaciones completadas
              </div>
            </div>
          </div>
          <span class="pill" style="font-size:0.72rem;">Pago protegido</span>
        </div>
      `;
    } catch (err) { /* silencioso: no bloquear la operación por esto */ }
  }

  // --- Valorar la operación, una vez entregada ---
  const reviewSection = document.getElementById('reviewSection');
  if (reviewSection) {
    try {
      const status = await YQV.api(`/api/bookings/${bookingId}/review-status`);
      if (status.already_reviewed) {
        reviewSection.innerHTML = `<div class="alert alert-info">Ya has valorado esta operación. Gracias.</div>`;
      } else {
        reviewSection.innerHTML = `
          <div class="card">
            <h3 style="font-size:1rem;">¿Qué tal ha ido?</h3>
            <p class="muted" style="font-size:0.85rem;">Valora a ${isSender ? 'quien ha llevado tu envío' : 'quien ha enviado el paquete'}.</p>
            <div class="row" id="starRow" style="gap:4px; font-size:1.6rem; cursor:pointer;">
              ${[1, 2, 3, 4, 5].map(n => `<span data-star="${n}" style="color:var(--line);">★</span>`).join('')}
            </div>
            <button type="button" class="btn btn-primary" id="submitReviewBtn" style="margin-top:12px;" disabled>Enviar valoración</button>
          </div>
        `;
        let selected = 0;
        const stars = reviewSection.querySelectorAll('[data-star]');
        const submitBtn = document.getElementById('submitReviewBtn');
        function paintStars(n) {
          stars.forEach((s) => { s.style.color = Number(s.dataset.star) <= n ? 'var(--sun)' : 'var(--line)'; });
        }
        stars.forEach((s) => {
          s.addEventListener('mouseenter', () => paintStars(Number(s.dataset.star)));
          s.addEventListener('click', () => { selected = Number(s.dataset.star); paintStars(selected); submitBtn.disabled = false; });
        });
        reviewSection.querySelector('#starRow').addEventListener('mouseleave', () => paintStars(selected));
        submitBtn.addEventListener('click', async () => {
          try {
            await YQV.api(`/api/bookings/${bookingId}/review`, { method: 'POST', body: { rating: selected } });
            YQV.toast('¡Gracias por tu valoración!', 'ok');
            reviewSection.innerHTML = `<div class="alert alert-info">Ya has valorado esta operación. Gracias.</div>`;
          } catch (err) { YQV.toast(err.message, 'error'); }
        });
      }
    } catch (err) { /* silencioso */ }
  }
}
load();
</script>
</body>
</html>
