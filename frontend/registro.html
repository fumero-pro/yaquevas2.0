<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta — YaQueVas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="yqv-nav"></div>

<section class="section" style="max-width:480px; margin:0 auto;">
  <div class="container">
    <h1>Crea tu cuenta</h1>
    <div id="referralBanner"></div>
    <div class="card">
      <div id="formError" role="alert" aria-live="assertive"></div>
      <form id="regForm">
        <div class="field-row cols-2">
          <div><label class="first" for="name">Nombre</label><input id="name" required></div>
          <div><label class="first" for="surname">Apellidos</label><input id="surname" required></div>
        </div>
        <label for="email">Email</label>
        <input id="email" type="email" required>
        <label for="phone">Teléfono</label>
        <input id="phone" type="tel" placeholder="+34 600 000 000">
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input id="password" type="password" required minlength="8">
          <button type="button" class="password-toggle" data-toggle-for="password" aria-label="Mostrar contraseña"></button>
        </div>
        <p class="field-hint">Mínimo 8 caracteres.</p>
        <label for="country">País</label>
        <select id="country">
          <option value="ES" selected>España</option>
          <option value="OTRO">Otro</option>
        </select>
        <div class="checkbox-row">
          <input id="terms" type="checkbox" required>
          <label for="terms">He leído y acepto los <a href="/legal.html?doc=terminos" target="_blank">términos y condiciones</a> y la <a href="/legal.html?doc=privacidad" target="_blank">política de privacidad</a>.</label>
        </div>
        <div class="checkbox-row">
          <input id="ageConfirmed" type="checkbox" required>
          <label for="ageConfirmed">Confirmo que soy mayor de 18 años.</label>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Crear cuenta</button>
      </form>
    </div>
    <p class="center" style="margin-top:16px;">¿Ya tienes cuenta? <a href="/login.html">Accede aquí</a></p>
  </div>
</section>

<div id="yqv-footer"></div>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/nav.js"></script>
<script>
// Programa de referidos: si llegaste desde un enlace de invitación (?ref=CODIGO), lo guardamos
// y lo mandamos con el registro. La recompensa no se da aquí — se paga cuando completes tu
// primera operación real (ver backend/src/lib/referral.js), nunca por registrarte sin más.
const referralCode = new URLSearchParams(window.location.search).get('ref');
if (referralCode) {
  document.getElementById('referralBanner').innerHTML = `
    <div class="alert alert-info" style="margin-bottom:16px;">
      <span data-yqv-icon="gift" data-yqv-icon-size="16"></span>
      Te han invitado a YaQueVas. Cuando completes tu primera operación, tú y quien te invitó ganaréis un descuento en la comisión de vuestra próxima operación.
    </div>`;
}

document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('formError');
  errBox.innerHTML = '';
  const body = {
    name: document.getElementById('name').value.trim(),
    surname: document.getElementById('surname').value.trim(),
    email: document.getElementById('email').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    password: document.getElementById('password').value,
    country: document.getElementById('country').value,
    accepted_terms: document.getElementById('terms').checked,
    age_confirmed: document.getElementById('ageConfirmed').checked,
    referral_code: referralCode || undefined,
  };
  try {
    const data = await YQV.api('/api/auth/register', { method: 'POST', body, auth: false });
    YQV.setSession(data.token, data.user);
    YQV.toast('Cuenta creada. ¡Bienvenido a YaQueVas!', 'ok');
    window.location.href = '/mi-cuenta.html';
  } catch (err) {
    errBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  }
});
</script>
</body>
</html>
