<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmar email — YaQueVas</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="yqv-nav"></div>

<section class="section" style="max-width:440px; margin:0 auto;">
  <div class="container">
    <h1>Confirmar tu email</h1>
    <div class="card">
      <div id="resultBox">Confirmando...</div>
    </div>
  </div>
</section>

<div id="yqv-footer"></div>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/nav.js"></script>
<script>
const token = new URLSearchParams(window.location.search).get('token');
const resultBox = document.getElementById('resultBox');

async function confirm() {
  if (!token) {
    resultBox.innerHTML = '<div class="alert alert-error">Este enlace no es válido. Pide uno nuevo desde "Mi cuenta".</div>';
    return;
  }
  try {
    await YQV.api('/api/auth/verify-email', { method: 'POST', body: { token }, auth: false });
    resultBox.innerHTML = `
      <div class="alert alert-ok">Email confirmado. Ya está todo listo.</div>
      <a href="/mi-cuenta.html" class="btn btn-primary btn-block" style="margin-top:14px;">Ir a mi cuenta</a>
    `;
  } catch (err) {
    resultBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  }
}
confirm();
</script>
</body>
</html>
