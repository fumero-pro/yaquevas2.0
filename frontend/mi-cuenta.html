<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi cuenta — YaQueVas</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="yqv-nav"></div>

<section class="section">
  <div class="container">
    <h1 id="greeting">Mi cuenta</h1>

    <div id="notifBox" style="margin-bottom:24px;"></div>
    <div id="contactVerifyBox" style="margin-bottom:24px;"></div>
    <div id="identityBox" style="margin-bottom:24px;"></div>
    <div id="referralBox" style="margin-bottom:24px;"></div>

    <h2>Mis operaciones</h2>
    <p class="muted">Envíos y viajes ya emparejados: aquí sigues el estado, aceptas, pagas y entregas.</p>
    <div id="bookingsBox" class="stack"></div>

    <div class="divider"></div>

    <div class="card-grid cols-2">
      <div>
        <h2>Mis viajes publicados</h2>
        <div id="tripsBox" class="stack"></div>
      </div>
      <div>
        <h2>Mis envíos publicados</h2>
        <div id="shipmentsBox" class="stack"></div>
      </div>
    </div>
  </div>
</section>

<div id="yqv-footer"></div>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/nav.js"></script>
<script>
if (!YQV.requireLoginOrRedirect()) { /* redirige */ }

async function load() {
  const user = YQV.getUser();
  if (!user) return; // no autenticado: requireLoginOrRedirect ya está navegando a login.html
  document.getElementById('greeting').textContent = `Hola, ${user.name}`;

  try {
    const me = await YQV.api('/api/me');

    const contactBox = document.getElementById('contactVerifyBox');
    const contactCards = [];
    if (!me.user.email_verified) {
      contactCards.push(`
        <div class="card row between" style="gap:12px; flex-wrap:wrap;">
          <div><strong>Confirma tu email</strong><p class="muted" style="margin:2px 0 0;">Te escribimos a ${YQV.escapeHtml(me.user.email)} al registrarte. Revisa también spam.</p></div>
          <button class="btn btn-outline" id="resendVerifyBtn">Reenviar email</button>
        </div>
      `);
    }
    // La confirmación por SMS existe en el backend (modo simulado, sin Twilio configurado) pero
    // no se ofrece aquí: el usuario decidió que la cuenta se confirme solo por email para no
    // asumir el coste de un proveedor de SMS real. Volver a mostrarla cuando/si se conecte Twilio
    // (ver docs/SMS_SETUP.md) — el HTML de la tarjeta está en el historial de git si hace falta.
    contactBox.innerHTML = contactCards.join('');

    const resendBtn = document.getElementById('resendVerifyBtn');
    if (resendBtn) resendBtn.addEventListener('click', async () => {
      resendBtn.disabled = true;
      try { const r = await YQV.api('/api/auth/resend-verification', { method: 'POST' }); YQV.toast(r.mensaje || 'Email reenviado.', 'ok'); }
      catch (err) { YQV.toast(err.message, 'error'); resendBtn.disabled = false; }
    });
    const identityBox = document.getElementById('identityBox');
    if (me.user.identity_verified) {
      identityBox.innerHTML = `<div class="pill ok">${YQVIcons.svg('check', { size: 14 })} Identidad verificada</div>`;
    } else {
      identityBox.innerHTML = `
        <div class="card" style="display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;">
          <div>
            <h3 style="margin-bottom:4px;">Confirmemos quién eres</h3>
            <p class="muted" style="margin:0;">Necesaria para publicar envíos o aceptar transportar uno. Solo se pide una vez: tu documento y una foto se usan solo para esta verificación, nunca se comparten ni se vuelven a pedir por chat.</p>
          </div>
          <button class="btn btn-primary" id="verifyIdentityBtn">Verificar ahora</button>
        </div>
      `;
      document.getElementById('verifyIdentityBtn').addEventListener('click', async () => {
        try {
          const res = await YQV.api('/api/me/identity/start', { method: 'POST' });
          if (res.verification_url) { window.location.href = res.verification_url; return; }
          YQV.toast(res.aviso || 'Identidad verificada.', 'ok');
          load();
        } catch (err) { YQV.toast(err.message, 'error'); }
      });
    }
  } catch { /* si falla, no bloquea el resto de la página */ }

  try {
    const ref = await YQV.api('/api/me/referral');
    const referralBox = document.getElementById('referralBox');
    const link = `${window.location.origin}/registro.html?ref=${ref.referral_code}`;
    const completados = ref.invitados.filter(i => i.completo_primera_operacion).length;
    const descuentoAviso = ref.descuento_disponible_pct
      ? `<div class="alert alert-ok" style="margin-bottom:12px;">Tienes un <strong>${ref.descuento_disponible_pct}% de descuento</strong> en la comisión de tu próxima operación. Se aplica solo, sin que tengas que hacer nada.</div>`
      : '';
    referralBox.innerHTML = `
      <div class="card">
        <h3 style="margin-bottom:4px; display:flex; align-items:center; gap:8px;">${YQVIcons.svg('gift', { size: 18 })} Invita y gana un descuento</h3>
        <p class="muted" style="margin:0 0 12px;">Cuando la persona que invitas complete su primera operación, ganáis un ${ref.reward_pct}% de descuento en la comisión de vuestra próxima operación — los dos. Nunca al registrarse, solo al completar de verdad.</p>
        ${descuentoAviso}
        <div class="row" style="gap:10px; flex-wrap:wrap; margin-bottom:12px;">
          <code style="background:var(--mist-100); padding:8px 14px; border-radius:var(--radius-sm); font-weight:700; letter-spacing:0.03em;">${ref.referral_code}</code>
          <button class="btn btn-outline" id="copyReferralBtn">Copiar enlace</button>
          <button class="btn btn-primary" id="shareReferralBtn">Compartir invitación</button>
        </div>
        <div class="row" style="gap:20px; font-size:0.9rem;">
          <span><strong>${ref.invitados.length}</strong> invitados</span>
          <span><strong>${completados}</strong> completaron su primera operación</span>
          <span><strong style="color:var(--ok);">${ref.creditos_pendientes}</strong> descuentos pendientes de usar</span>
        </div>
      </div>
    `;
    document.getElementById('copyReferralBtn').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(link); YQV.toast('Enlace copiado.', 'ok'); }
      catch { YQV.toast(link, 'info'); }
    });
    document.getElementById('shareReferralBtn').addEventListener('click', () => {
      YQV.share({ title: 'YaQueVas', text: `Únete a YaQueVas con mi invitación: cuando completes tu primera operación, ganamos un ${ref.reward_pct}% de descuento cada uno.`, url: link });
    });
  } catch { /* si falla, no bloquea el resto de la página */ }

  try {
    const notifs = await YQV.api('/api/notifications');
    const unread = notifs.notifications.filter(n => !n.read);
    const notifBox = document.getElementById('notifBox');
    notifBox.innerHTML = unread.length === 0 ? '' : `
      <div class="card">
        <h3 style="font-size:1rem;">Notificaciones (${unread.length})</h3>
        <div class="stack">
          ${unread.slice(0, 8).map(n => `
            <button type="button" class="notif-item unread" data-id="${n.id}" data-related="${n.related_type === 'booking' && n.related_id ? `/operacion.html?id=${n.related_id}` : '/mi-cuenta.html'}" style="border:1px solid var(--line); border-radius:var(--radius-sm);">
              <div class="row between">
                <span><strong>${YQV.escapeHtml(n.title)}</strong> — ${YQV.escapeHtml(n.body || '')}</span>
                <span class="muted" style="font-size:0.8rem;">${YQV.fmtDateTime(n.created_at)}</span>
              </div>
            </button>
          `).join('')}
        </div>
      </div>
    `;
    notifBox.querySelectorAll('.notif-item[data-id]').forEach((el) => {
      el.addEventListener('click', async () => {
        try { await YQV.api(`/api/notifications/${el.dataset.id}/read`, { method: 'POST' }); } catch {}
        window.location.href = el.dataset.related;
      });
    });
  } catch {}

  try {
    const data = await YQV.api('/api/bookings');
    const box = document.getElementById('bookingsBox');
    if (data.bookings.length === 0) {
      box.innerHTML = '<div class="alert alert-info">Todavía no tienes ninguna operación en marcha.</div>';
    } else {
      box.innerHTML = data.bookings.map(b => {
        const role = b.sender_id === user.id ? 'Remitente' : 'Viajero';
        return `
        <div class="card row between">
          <div>
            <span class="pill">${role}</span> <strong style="margin-left:8px;">${YQV.STATUS_LABELS[b.status] || b.status}</strong>
            <div class="muted" style="font-size:0.85rem;">Base: ${YQV.fmtEur(b.base_price)} · ${role === 'Remitente' ? 'Pagas ' + YQV.fmtEur(b.sender_total) : 'Cobras ' + YQV.fmtEur(b.traveler_net)}</div>
          </div>
          <a class="btn btn-outline" href="/operacion.html?id=${b.id}">Ver operación</a>
        </div>`;
      }).join('');
    }
  } catch (err) { YQV.toast(err.message, 'error'); }

  try {
    const data = await YQV.api('/api/trips?mine=1');
    const box = document.getElementById('tripsBox');
    box.innerHTML = data.trips.length === 0 ? `
      <div class="empty-state">
        ${YQVIcons.svg('suitcase', { size: 26 })}
        <p>Todavía no has publicado ningún viaje.</p>
        <a href="/ya-voy.html" class="btn btn-outline">Publicar mi primer viaje</a>
      </div>
    ` : data.trips.map(t => `
      <div class="card">
        <strong>${t.origin_island} → ${t.destination_island}</strong> · ${YQV.fmtDate(t.trip_date)}
        <div class="muted" style="font-size:0.85rem;">${YQV.STATUS_LABELS[t.status] || t.status} · Espacio usado: ${t.status_capacidad.space_used_pct}%</div>
      </div>
    `).join('');
  } catch {}

  try {
    const data = await YQV.api('/api/shipments?mine=1');
    const box = document.getElementById('shipmentsBox');
    box.innerHTML = data.shipments.length === 0 ? `
      <div class="empty-state">
        ${YQVIcons.svg('package', { size: 26 })}
        <p>Todavía no has publicado ningún envío.</p>
        <a href="/enviar.html" class="btn btn-outline">Publicar mi primer envío</a>
      </div>
    ` : data.shipments.map(s => `
      <div class="card">
        <strong>${s.origin_island} → ${s.destination_island}</strong> · ${YQV.fmtDate(s.desired_date)}
        <div class="muted" style="font-size:0.85rem;">${YQV.STATUS_LABELS[s.status] || s.status} · ${s.items.length} bulto(s)</div>
      </div>
    `).join('');
  } catch {}
}
load();
</script>
</body>
</html>
